name: Actualizar videos de YouTube
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar la lista de videos del canal
        run: |
          curl -fsSL -A "Mozilla/5.0" "https://www.youtube.com/feeds/videos.xml?channel_id=UC09HaR2wnkdDKSk1SLqJVFA" -o feed.xml
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          ns = {'a': 'http://www.w3.org/2005/Atom', 'y': 'http://www.youtube.com/xml/schemas/2015'}
          raiz = ET.parse('feed.xml').getroot()
          videos = [{'id': e.find('y:videoId', ns).text, 't': e.find('a:title', ns).text, 'f': e.find('a:published', ns).text[:10]} for e in raiz.findall('a:entry', ns)][:12]
          json.dump(videos, open('videos.json', 'w'), ensure_ascii=False, indent=1)
          PY
          rm -f feed.xml
      - name: Guardar si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Actualizar videos del canal" && git push)
